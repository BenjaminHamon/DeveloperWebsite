# cspell:words pycache pytest venv

---

import:
  - "@cspell/dict-fr-fr/cspell-ext.json"

files:
  - "**"
  - "**/.*/**"

ignorePaths:
  - ".git/**"
  - ".venv-automation/**"
  - ".venv/**"
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/*.egg-info/**"
  - "Artifacts/**"
  - "Sources/*/build/**"

language: en

words:
  - benjaminhamon
  - bhamon
  - hamon
